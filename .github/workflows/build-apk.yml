name: Build Android APK

# Builds a release APK and publishes it to a GitHub Release so the download
# URL ends in .apk (Actions artifacts would only give a .zip).

on:
  push:
    branches: [claude/tdee-calculator-flutter-8xowao]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      # Presence check for the optional release keystore (secrets can't be used
      # directly in step `if:`, so surface it as a job-level env var).
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons & splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Optional release signing: only runs when the keystore secret is present.
      - name: Configure release signing
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/vita-release.jks
          cat > android/key.properties <<EOF
          storeFile=vita-release.jks
          storePassword=$KS_PASS
          keyAlias=$KS_ALIAS
          keyPassword=$KEY_PASS
          EOF

      # Real AdMob unit ids come from secrets; the shell falls back to Google's
      # public TEST ids when a secret is unset so the build always succeeds.
      - name: Build release APK
        env:
          BANNER_ANDROID: ${{ secrets.ADMOB_BANNER_ANDROID }}
          BANNER_IOS: ${{ secrets.ADMOB_BANNER_IOS }}
        run: |
          ANDROID_ID="${BANNER_ANDROID:-ca-app-pub-3940256099942544/6300978111}"
          IOS_ID="${BANNER_IOS:-ca-app-pub-3940256099942544/2934735716}"
          flutter build apk --release \
            --dart-define=ADMOB_BANNER_ANDROID="$ANDROID_ID" \
            --dart-define=ADMOB_BANNER_IOS="$IOS_ID"

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/vita-tdee.apk
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vita-tdee-apk
          path: dist/vita-tdee.apk

      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Vita APK — build ${{ github.run_number }}
          body: |
            Automated release build of the Vita TDEE app.
            Direct download: **vita-tdee.apk** (asset below).

            Signed with the release keystore when configured (repo secrets),
            otherwise debug-signed for testing. Ad unit ids come from secrets
            with Google test ids as the fallback.
          files: dist/vita-tdee.apk
