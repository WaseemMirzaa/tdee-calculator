name: Build Android APK

# Builds a release APK and publishes it to a GitHub Release so the download
# URL ends in .apk (Actions artifacts would only give a .zip).

on:
  push:
    branches: [claude/tdee-calculator-flutter-8xowao]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/vita-tdee.apk
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vita-tdee-apk
          path: dist/vita-tdee.apk

      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Vita APK — build ${{ github.run_number }}
          body: |
            Automated release build of the Vita TDEE app.
            Direct download: **vita-tdee.apk** (asset below).

            Signed with debug keys for testing. Replace with a production
            keystore + real AdMob / billing IDs before store submission.
          files: dist/vita-tdee.apk
