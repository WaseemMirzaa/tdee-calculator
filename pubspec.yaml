name: vita_tdee
description: "Vita — a TDEE / calorie calculator and meal-planning app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Local SQL database (sqflite + raw SQL, no codegen)
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0

  # Charts (Journey trend + projections)
  fl_chart: ^0.69.0

  # Ads (free, ad-supported) + iOS App Tracking Transparency
  google_mobile_ads: ^5.1.0
  app_tracking_transparency: ^2.0.6

  # Local notifications (restock reminders)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Misc
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/tdee_seed.json

# Branded app icon (generated into every density by flutter_launcher_icons).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "assets/branding/icon_background.png"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"

# Branded splash (generated by flutter_native_splash).
# Dark-first branded splash — deep ground in both themes to match the
# dark-by-default app and the emerald logo badge.
flutter_native_splash:
  color: "#0B120F"
  color_dark: "#0B120F"
  image: "assets/branding/splash.png"
  image_dark: "assets/branding/splash.png"
  android_12:
    color: "#0B120F"
    color_dark: "#0B120F"
    image: "assets/branding/splash.png"
